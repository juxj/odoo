version: '3.8'

services:
  # Odoo 服务
  odoo:
    # 我们使用官方的Odoo镜像作为基础环境，因为它已经包含了所有系统依赖
    image: odoo:17.0
    container_name: odoo-dev-service
    # 依赖于数据库服务，确保数据库先启动
    depends_on:
      - db
    ports:
      - "8069:8069"  # Odoo 网页端口
      - "8072:8072"  # Live Chat 端口
    # 核心部分：挂载卷（Volumes）
    volumes:
      # 1. 挂载我们本地的Odoo源码，覆盖镜像中原有的代码
      - ./odoo:/usr/lib/python3/dist-packages/odoo
      # 2. 挂载我们本地的自定义模块目录
      - ./custom-addons:/mnt/extra-addons
      # 3. 挂载我们的配置文件
      - ./odoo.conf:/etc/odoo/odoo.conf
    # 重启策略，确保容器在退出后能自动重启
    restart: always
    # 指定容器启动时执行的命令，这里是使用我们挂载的配置文件
    command: --config /etc/odoo/odoo.conf

  # PostgreSQL 数据库服务
  db:
    # 使用与Odoo版本兼容的PostgreSQL镜像
    image: postgres:15-alpine
    container_name: odoo-dev-db
    # 环境变量，用于初始化数据库
    environment:
      - POSTGRES_USER=odoo             # 必须与 odoo.conf 中的 db_user 一致
      - POSTGRES_PASSWORD=my-db-password # 必须与 odoo.conf 中的 db_password 一致
      - POSTGRES_DB=postgres         # 数据库服务启动时默认创建的库
      - PGDATA=/var/lib/postgresql/data/pgdata
    # 数据持久化，将数据库数据存储在本地的 docker volume 中
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    # 重启策略
    restart: always

# Docker Volume 定义，用于持久化数据库数据
volumes:
  db-data:
