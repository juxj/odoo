services:
  odoo:
    image: odoo:18.0
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo-docker.conf:/etc/odoo/odoo.conf:ro
      - ./odoo:/usr/lib/python3/dist-packages/odoo
      - ./addons:/mnt/odoo-addons
      - ./custom-addons:/mnt/custom-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - POSTGRES_DB=postgres
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--dev=reload,xml,qweb,assets"]
    restart: unless-stopped
    networks:
      - odoo-network

  db:
    image: postgres:16
    container_name: pg
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"  # 可选：用于调试数据库连接
    restart: unless-stopped
    networks:
      - odoo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  odoo-data:
  db-data:

networks:
  odoo-network:
    driver: bridge